<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Number Guessing Game</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-MpR7az4h1eDBpYybK2rF8qqqMMC+P7z5Yx1HIi6w3qEZd3axzFg7h1gYIYjWdiC5"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid bg-container d-flex align-items-center justify-content-center">
      <div class="row w-100 justify-content-center">
        <div class="col-12 col-lg-10">
          <div class="guess-card shadow-lg">
            <div class="row align-items-center">
              <div class="col-12 col-md-6 text-center">
                <img
                  class="guess-game-img"
                  src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/guess-game-img.png"
                  alt="Guessing game illustration"
                />
              </div>
              <div class="col-12 col-md-6 text-center text-md-left mt-4 mt-md-0">
                <h1 class="guess-heading mb-3">Guessing Game</h1>
                <p class="game-description mb-4">
                  Find out the right number between 1 and 100.
                </p>
                <div class="guess-input-group mx-auto mx-md-0">
                  <input
                    type="number"
                    min="1"
                    max="100"
                    class="user-input"
                    id="userInput"
                    placeholder="Enter a number"
                  />
                  <button class="btn btn-primary check-guess" onclick="checkGuess()">
                    Check
                  </button>
                </div>
                <p class="game-result" id="gameResult"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
